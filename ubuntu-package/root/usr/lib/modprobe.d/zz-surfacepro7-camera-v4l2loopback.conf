# Surface-Pro-7-Webcams (gespeist von sp7-relayd@front/back.service). Ueberschreibt die
# Werte aus v4l2-relayd.conf (Dateien werden alphabetisch gelesen, der letzte Wert gilt).
# exclusive_caps=1 wie von v4l2-relayd vorgesehen: die Dienste halten die Geraete ab dem
# Booten als Kamera bereit, auch fuer Apps, die direkt auf V4L2 zugreifen.
options v4l2loopback devices=2 video_nr=60,61 exclusive_caps=1,1 card_label="Surface Camera Front,Surface Camera Back"
