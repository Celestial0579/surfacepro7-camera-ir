# Surface-Pro-7-Kamera (IPU4P): NICHT von udev automatisch laden lassen.
# Vor dem Laden muss die IOMMU-Gruppe des ISP auf "identity" stehen, sonst
# scheitert die Firmware-Pruefung. Das erledigt sp7-camera.service beim Booten
# ueber /usr/local/sbin/sp7-camera-load (blacklist wirkt nur auf Autoload).
blacklist intel_ipu4
blacklist intel_ipu4_isys
blacklist intel_ipu4_psys
blacklist surfacepro7_acpi
